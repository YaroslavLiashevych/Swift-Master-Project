name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важливо для пошуку змінених файлів

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Get Changed Swift Files
        id: changed-files
        # Використовуємо стандартний інструмент для пошуку файлів у PR
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.swift'

      - name: 4. Run Analyzer for each file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🚀 Запускаємо аналіз змінених файлів..."
          
          # Отримуємо список файлів. Якщо порожньо - виходимо
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$FILES" ]; then
            echo "Немає змінених .swift файлів для аналізу."
            exit 0
          fi
          
          # Запускаємо аналізатор для КОЖНОГО файлу окремо
          for file in $FILES; do
            echo "🔍 Аналіз файлу: $file"
            
            # Створюємо унікальне ім'я для звіту, замінюючи слеші на підкреслення
            report_name="report_$(echo "$file" | sed 's/\//_/g').json"
            
            # Запускаємо твій інструмент
            swift run --package-path ./tool-repo/Analyzer Analyzer "$file" --api-key $GROQ_API_KEY --output "$report_name"
            
            # Пауза 2 секунди, щоб Groq API не заблокував нас за спам (Rate Limit)
            sleep 2
          done

      - name: 5. Post AI Comments with Auto-Fix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Шукаємо всі згенеровані файли звітів
            const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('report_') && f.endsWith('.json'));
            
            if (reportFiles.length === 0) {
              console.log('ℹ️ Звітів не знайдено.');
              return;
            }
            
            // Видаляємо попередні загальні коментарі від бота, щоб не засмічувати PR
            if (context.eventName === 'pull_request') {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComments = comments.filter(c => 
                c.user.login === 'github-actions[bot]' && 
                c.body.includes('## 🤖 Swift Hybrid AI Review')
              );
              
              for (const comment of botComments) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
                console.log(`🗑️ Видалено старий коментар: ${comment.id}`);
              }
            }
            
            let summaryText = '## 🤖 Swift Hybrid AI Review\n\n';
            let fallbackSuggestions = [];
            let totalIssues = 0;
            
            // Проходимося по звіту кожного файлу
            for (const file of reportFiles) {
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (!report.aiReview) continue;
              
              // Зберігаємо відносний шлях для GitHub API
              const filePath = report.analyzedFile || 'Unknown.swift';
              summaryText += `### 📄 \`${filePath}\`\n**Висновок:** ${report.aiReview.summary}\n\n`;
              
              if (report.aiReview.suggestions && report.aiReview.suggestions.length > 0) {
                totalIssues += report.aiReview.suggestions.length;
                
                for (const s of report.aiReview.suggestions) {
                  try {
                    // Створюємо Inline-кнопку
                    await github.rest.pulls.createReview({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.issue.number,
                      event: 'COMMENT',
                      comments: [{
                        path: filePath,
                        line: s.line,
                        body: `**[${s.issue_type}]**\n${s.explanation}\n\n\`\`\`suggestion\n${s.fixed_code}\n\`\`\``
                      }]
                    });
                  } catch (error) {
                    // Якщо рядок старий і GitHub блокує кнопку, зберігаємо у fallback
                    fallbackSuggestions.push({ filePath, ...s });
                  }
                }
              }
            }
            
            // Формуємо фінальний текстовий коментар для старих рядків
            if (fallbackSuggestions.length > 0) {
               summaryText += `\n---\n### 📌 Зауваження до коду (поза зоною поточних змін PR):\n`;
               fallbackSuggestions.forEach(s => {
                  summaryText += `- **Файл \`${s.filePath}\`, Рядок ${s.line}** (${s.issue_type}): ${s.explanation}\n`;
                  summaryText += `\n\`\`\`swift\n// Виправлений код:\n${s.fixed_code}\n\`\`\`\n\n`;
               });
            } else if (totalIssues === 0) {
               summaryText += `✅ **Усі перевірені файли виглядають чудово, критичних зауважень немає!**`;
            }
            
            // Публікуємо фінальний загальний коментар
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summaryText
            });
