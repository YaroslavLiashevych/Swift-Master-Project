name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Get Changed Swift Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.swift'

      - name: 4. Run Analyzer for each file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$FILES" ]; then exit 0; fi
          
          for file in $FILES; do
            echo "🔍 Аналіз файлу: $file"
            report_name="report_$(echo "$file" | sed 's/\//_/g').json"
            
            swift run --package-path ./tool-repo/Analyzer Analyzer "$file" --api-key $GROQ_API_KEY --output "$report_name"
            
            echo "⏳ Очікування 45 секунд (Rate Limit Groq)..."
            sleep 45
          done

      - name: 5. Post AI Comments with Auto-Fix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // 1. Отримуємо дані про PR та список змінених файлів
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const commit_id = pullRequest.head.sha;

            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const prPaths = prFiles.map(f => f.filename);

            const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('report_') && f.endsWith('.json'));
            if (reportFiles.length === 0) return;

            // 2. Видалення старих коментарів бота
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const botComments = comments.filter(c => c.user.login === 'github-actions[bot]' && c.body.includes('## 🤖 Swift Hybrid AI Review'));
            for (const comment of botComments) {
              await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: comment.id });
            }

            let summaryText = '## 🤖 Swift Hybrid AI Review\n\n';
            let totalIssues = 0;

            for (const file of reportFiles) {
              let rawContent = fs.readFileSync(file, 'utf8');
              let report;
              
              try {
                // Використовуємо Regex для надійного витягування JSON
                const jsonMatch = rawContent.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("JSON об'єкт не знайдено у відповіді");
                report = JSON.parse(jsonMatch[0]);
              } catch (e) {
                console.error(`❌ Помилка парсингу ${file}:`, e.message);
                summaryText += `⚠️ **Файл \`${file}\`**: Не вдалося обробити звіт через помилку формату ШІ.\n\n`;
                continue;
              }

              if (!report.summary) continue;
              
              // Знаходимо реальний шлях файлу в проекті
              const fileNameInReport = file.replace('report_', '').replace(/_/g, '/').replace('.json', '');
              const realFilePath = prPaths.find(p => p.includes(fileNameInReport)) || fileNameInReport;

              summaryText += `### 📄 \`${realFilePath}\`\n**Висновок:** ${report.summary}\n\n`;

              if (report.suggestions && report.suggestions.length > 0) {
                for (const s of report.suggestions) {
                  totalIssues++;
                  try {
                    await github.rest.pulls.createReviewComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.issue.number,
                      commit_id: commit_id,
                      path: realFilePath,
                      line: s.line,
                      side: 'RIGHT',
                      body: `**[${s.issue_type}]**\n${s.explanation}\n\n\`\`\`suggestion\n${s.fixed_code}\n\`\`\``
                    });
                  } catch (error) {
                    console.log(`⚠️ Не вдалося створити Suggestion для ${realFilePath}:${s.line} - ${error.message}`);
                  }
                }
              }
            }

            if (totalIssues === 0) {
              summaryText += "✅ Критичних зауважень не виявлено.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: summaryText
            });
