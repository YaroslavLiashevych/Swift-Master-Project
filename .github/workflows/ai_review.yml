name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Run Native Swift Analyzer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🚀 Запускаємо твій власний Swift-інструмент..."
          # Запускаємо твій код, який сам звернеться до Groq
          swift run --package-path ./tool-repo/Analyzer Analyzer ${{ github.workspace }}/TestFile.swift --api-key $GROQ_API_KEY --output ${{ github.workspace }}/report.json

      - name: 4. Post AI Comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Читаємо згенерований твоїм Swift-кодом звіт
            if (!fs.existsSync('report.json')) {
              console.log('❌ report.json не знайдено!');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
            if (!report.aiReview) {
              console.log('⚠️ ШІ не повернув поле aiReview');
              return;
            }
            
            // Формуємо красивий Markdown коментар на основі твоєї моделі AIReviewResponse
            let body = `## 🤖 Swift Hybrid AI Review\n\n**Висновок:** ${report.aiReview.summary}\n\n`;
            
            if (report.aiReview.suggestions && report.aiReview.suggestions.length > 0) {
              body += `### 🛠 Запропоновані виправлення:\n`;
              report.aiReview.suggestions.forEach(s => {
                body += `- **Рядок ${s.line}** (${s.issue_type}): ${s.explanation}\n`;
                body += `\n\`\`\`swift\n// До:\n${s.original_code}\n\n// Після:\n${s.fixed_code}\n\`\`\`\n\n`;
              });
            } else {
              body += `✅ Код виглядає чудово, критичних зауважень немає!\n`;
            }
            
            // Публікуємо коментар, якщо це Pull Request
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('✅ Коментар успішно додано до PR!');
            } else {
              console.log('ℹ️ Це ручний запуск (не PR). Ось що написав би бот:\n\n' + body);
            }
