name: Conductor AI Agent Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    # Використовуємо macOS, оскільки нам потрібен Swift для компіляції Analyzer
    runs-on: macos-15

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project (SwiftUI App)
        uses: actions/checkout@v4

      - name: 2. Checkout Analyzer Tool (SwiftHybridAnalyzer)
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo
          # Якщо репозиторій приватний, розкоментуй рядок нижче та додай секрет PAT
          # token: ${{ secrets.MY_PAT_TOKEN }}

      - name: 3. Install Conductor CLI
        run: |
          echo "📥 Installing Conductor..."
          curl -fsSL https://get.conductor.build/install.sh | sh
          
          # Перевіряємо, чи з'явився файл, щоб уникнути помилок
          if [ -f "$HOME/.conductor/bin/conductor" ]; then
            echo "✅ Conductor installed at $HOME/.conductor/bin/conductor"
          else
            echo "❌ Installation failed"
            exit 1
          fi

      - name: 4. Run AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Starting AI Agent..."
          
          # Використовуємо повний шлях до conductor, щоб уникнути помилки 'command not found'
          $HOME/.conductor/bin/conductor run "Проаналізуй файл TestFile.swift, використовуючи інструмент analyze_code з конфігурації ./tool-repo/conductor.yaml. 
          На основі згенерованого JSON-звіту (report.json), напиши коментар у цей Pull Request. 
          Чітко вкажи рядки коду, опис помилки та запропонуй виправлення у форматі Markdown." \
          --tool ./tool-repo/conductor.yaml \
          --env file_path=TestFile.swift \
          --env api_key=$GROQ_API_KEY
