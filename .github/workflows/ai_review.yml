name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Get Changed Swift Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.swift'

      - name: 4. Run Analyzer for each file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🚀 Починаємо аналіз..."
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$FILES" ]; then exit 0; fi
          
          for file in $FILES; do
            echo "🔍 Файл: $file"
            report_name="report_$(echo "$file" | sed 's/\//_/g').json"
            
            swift run --package-path ./tool-repo/Analyzer Analyzer "$file" --api-key $GROQ_API_KEY --output "$report_name"
            
            echo "⏳ Пауза 45с (Rate Limit)..."
            sleep 45
          done

      - name: 5. Post AI Comments with Auto-Fix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // 1. Отримуємо дані про PR та SHA коміту
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number
            });
            const commit_id = pullRequest.head.sha;

            // Отримуємо реальні шляхи файлів у проекті
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number
            });
            const prPaths = prFiles.map(f => f.filename);

            // 2. Видалення старих коментарів бота
            const { data: comments_list } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            for (const c of comments_list.filter(c => c.user.login === 'github-actions[bot]' && c.body.includes('## 🤖 Swift Hybrid AI Review'))) {
              await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id });
            }

            const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('report_') && f.endsWith('.json'));
            let summaryText = '## 🤖 Swift Hybrid AI Review\n\n';
            let allSuggestions = [];

            for (const file of reportFiles) {
              console.log(`📦 Обробка файлу звіту: ${file}`);
              const raw = fs.readFileSync(file, 'utf8');
              
              // Витягуємо JSON (захист від зайвого тексту від LLM)
              const match = raw.match(/\{[\s\S]*\}/);
              if (!match) {
                console.log(`⚠️ Не знайдено валідного JSON у ${file}`);
                continue;
              }
              
              let report;
              try {
                report = JSON.parse(match[0]);
              } catch (e) {
                console.error(`❌ Помилка JSON.parse у ${file}: ${e.message}`);
                continue;
              }

              // 1. Спочатку видаляємо префікс report_ та розширення .json
              // 2. Тільки потім міняємо підкреслення на слеші
              const cleanFileName = file
                .replace(/^report_/, '')
                .replace(/\.json$/, '')
                .replace(/_/g, '/');

              // Шукаємо точний збіг у списку змінених файлів PR
              const realPath = prPaths.find(p => p.includes(cleanFileName)) || cleanFileName;
              console.log(`📍 Мапінг завершено: ${file} -> ${realPath}`);

              summaryText += `### 📄 \`${realPath}\`\n${report.summary || 'Аналіз завершено'}\n\n`;

              if (report.suggestions && Array.isArray(report.suggestions)) {
                report.suggestions.forEach(s => {
                  allSuggestions.push({
                    path: realPath,
                    line: s.line,
                    side: 'RIGHT',
                    body: `**[${s.issue_type}]**\n${s.explanation}\n\n\`\`\`suggestion\n${s.fixed_code}\n\`\`\``
                  });
                });
              }
            }

            // 3. Публікація результатів
            if (allSuggestions.length > 0) {
              console.log(`🚀 Надсилаємо рев'ю з ${allSuggestions.length} зауваженнями...`);
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: commit_id,
                  event: 'COMMENT',
                  comments: allSuggestions
                });
                summaryText += `\n**Знайдено зауважень: ${allSuggestions.length}**`;
              } catch (e) {
                console.error(`❌ Помилка при створенні Review: ${e.message}`);
                summaryText += `\n⚠️ Не вдалося створити inline-коментарі. Перевірте логі консолі.`;
              }
            } else {
              summaryText += "✅ Критичних зауважень не виявлено.";
              console.log("✅ Жодних зауважень для публікації не знайдено.");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: summaryText
            });
