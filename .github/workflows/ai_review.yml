name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Run Native Swift Analyzer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🚀 Запускаємо твій власний Swift-інструмент..."
          swift run --package-path ./tool-repo/Analyzer Analyzer ${{ github.workspace }}/TestFile.swift --api-key $GROQ_API_KEY --output ${{ github.workspace }}/report.json

      - name: 4. Post AI Comment with Auto-Fix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Перевіряємо, чи існує звіт
            if (!fs.existsSync('report.json')) {
              console.log('❌ report.json не знайдено!');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
            if (!report.aiReview) {
              console.log('⚠️ ШІ не повернув поле aiReview');
              return;
            }
            
            // Витягуємо назву файлу (якщо шлях абсолютний, беремо тільки назву)
            let filePath = report.analyzedFile || 'TestFile.swift';
            if (filePath.includes('/')) filePath = filePath.split('/').pop();
            
            const summaryBody = `## 🤖 Swift Hybrid AI Review\n\n**Висновок:** ${report.aiReview.summary}`;
            
            if (context.eventName !== 'pull_request') {
              console.log('ℹ️ Ручний запуск. Звіт:\n', summaryBody);
              return;
            }
            
            let fallbackSuggestions = [];
            
            // 1. Проходимося по кожній помилці ОКРЕМО
            if (report.aiReview.suggestions && report.aiReview.suggestions.length > 0) {
              for (const s of report.aiReview.suggestions) {
                try {
                  // Намагаємось створити Inline Suggestion (кнопку авто-фіксу)
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    event: 'COMMENT',
                    comments: [{
                      path: filePath,
                      line: s.line,
                      body: `**[${s.issue_type}]**\n${s.explanation}\n\n\`\`\`suggestion\n${s.fixed_code}\n\`\`\``
                    }]
                  });
                  console.log(`✅ Створено inline-коментар для рядка ${s.line}`);
                } catch (error) {
                  // Якщо GitHub блокує кнопку (бо рядок старий і не входить в Diff PR), 
                  // зберігаємо цю помилку для загального текстового звіту
                  console.log(`⚠️ Рядок ${s.line} не в Diff. Зберігаємо як fallback.`);
                  fallbackSuggestions.push(s);
                }
              }
            }
            
            // 2. Формуємо загальний текстовий коментар
            let finalBody = summaryBody + '\n\n';
            
            if (fallbackSuggestions.length > 0) {
               finalBody += `### 📌 Зауваження до коду (поза зоною поточних змін PR):\n`;
               fallbackSuggestions.forEach(s => {
                  finalBody += `- **Рядок ${s.line}** (${s.issue_type}): ${s.explanation}\n`;
                  finalBody += `\n\`\`\`swift\n// Виправлений код:\n${s.fixed_code}\n\`\`\`\n\n`;
               });
            } else if (report.aiReview.suggestions.length === 0) {
               finalBody += `✅ Код виглядає чудово, критичних зауважень немає!`;
            }
            
            // 3. Публікуємо Summary і всі зауваження, які не отримали кнопок
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: finalBody
            });
