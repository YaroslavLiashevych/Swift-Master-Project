name: Conductor AI Agent Review
on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Target Project (This App)
        uses: actions/checkout@v4

      - name: Checkout Analyzer Tool (SwiftHybridAnalyzer)
        uses: actions/checkout@v4
        with:
            # Вказуємо ПРАВИЛЬНУ назву твого репозиторію
            repository: YaroslavLiashevych/SwiftHybridAnalyzer
            path: tool-repo

      - name: Install Conductor CLI
        run: |
          curl -fsSL https://get.conductor.build/install.sh | sh
          # Додаємо шлях до бінарника в системний PATH GitHub Actions
          echo "$HOME/.conductor/bin" >> $GITHUB_PATH

      - name: Run AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Тепер команда 'conductor' буде доступна
          conductor run "Використовуй інструмент із ./tool-repo/conductor.yaml для аналізу TestFile.swift. 
          На основі звіту report.json напиши коментар у цей PR з результатами та порадами." \
          --tool ./tool-repo/conductor.yaml \
          --env file_path=TestFile.swift \
          --env api_key=$GROQ_API_KEY
