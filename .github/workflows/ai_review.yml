name: Conductor AI Agent Review
on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:
jobs:
  agent-review:
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4
      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo
      - name: 3. Install and Run AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Installing Conductor..."
          for i in {1..5}; do
            curl -fsSL https://get.conductor.build/install.sh | sh && break || sleep 5
          done
          export PATH="$HOME/.conductor/bin:$PATH"
          echo "🚀 Starting AI Agent..."
          $HOME/.conductor/bin/conductor run "Проаналізуй TestFile.swift через ./tool-repo/conductor.yaml. На основі звіту report.json напиши коментар у PR з порадами та блоками fixed_code." \
          --tool ./tool-repo/conductor.yaml \
          --env file_path=TestFile.swift \
          --env api_key=$GROQ_API_KEY
