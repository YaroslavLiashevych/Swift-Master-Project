name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Get Changed Swift Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.swift'

      - name: 4. Run Analyzer for each file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$FILES" ]; then exit 0; fi
          
          for file in $FILES; do
            echo "🔍 Аналіз файлу: $file"
            # Створюємо унікальне ім'я для звіту
            report_name="report_$(echo "$file" | sed 's/\//_/g').json"
            
            # Запускаємо Swift-інструмент
            swift run --package-path ./tool-repo/Analyzer Analyzer "$file" --api-key $GROQ_API_KEY --output "$report_name"
            
            echo "⏳ Очікування 45 секунд (Rate Limit)..."
            sleep 45
          done

      - name: 5. Post AI Comments with Auto-Fix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // 1. Отримуємо дані про PR
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const commit_id = pullRequest.head.sha;

            const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('report_') && f.endsWith('.json'));
            if (reportFiles.length === 0) return;

            // 2. Видалення старих коментарів
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const botComments = comments.filter(c => c.user.login === 'github-actions[bot]' && c.body.includes('## 🤖 Swift Hybrid AI Review'));
            for (const comment of botComments) {
              await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: comment.id });
            }

            let summaryText = '## 🤖 Swift Hybrid AI Review\n\n';
            let fallbackSuggestions = [];
            let totalIssues = 0;

            for (const file of reportFiles) {
              let rawContent = fs.readFileSync(file, 'utf8');
              let report;
              
              try {
                // Спроба очистити JSON від можливих артефактів ШІ
                const cleanedContent = rawContent.substring(rawContent.indexOf('{'), rawContent.lastIndexOf('}') + 1);
                report = JSON.parse(cleanedContent);
              } catch (e) {
                console.error(`❌ Не вдалося розпарсити ${file}. Вміст був занадто "ламаний".`);
                summaryText += `⚠️ **Файл \`${file}\`**: ШІ згенерував занадто складний код, який не вдалося автоматично обробити.\n\n`;
                continue;
              }

              if (!report.aiReview) continue;
              
              // Знаходимо реальний шлях файлу
              const shortName = report.analyzedFile || '';
              const realFilePath = pullRequest.base.repo.full_name.includes(context.repo.repo) ? 
                                   (file.replace('report_', '').replace(/_/g, '/').replace('.json', '')) : shortName;

              summaryText += `### 📄 \`${realFilePath}\`\n**Висновок:** ${report.aiReview.summary}\n\n`;

              if (report.aiReview.suggestions && report.aiReview.suggestions.length > 0) {
                for (const s of report.aiReview.suggestions) {
                  totalIssues++;
                  try {
                    await github.rest.pulls.createReviewComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.issue.number,
                      commit_id: commit_id,
                      path: realFilePath,
                      line: s.line,
                      side: 'RIGHT',
                      body: `**[${s.issue_type}]**\n${s.explanation}\n\n\`\`\`suggestion\n${s.fixed_code}\n\`\`\``
                    });
                  } catch (error) {
                    console.log(`⚠️ Кнопка не створена для рядка ${s.line}: ${error.message}`);
                    fallbackSuggestions.push({ realFilePath, ...s });
                  }
                }
              }
            }

            // Формуємо фінальний текстовий звіт
            if (fallbackSuggestions.length > 0) {
              summaryText += `\n---\n### 📌 Додаткові зауваження:\n`;
              fallbackSuggestions.forEach(s => {
                summaryText += `- **${s.realFilePath}:${s.line}** [${s.issue_type}]: ${s.explanation}\n`;
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: summaryText
            });
