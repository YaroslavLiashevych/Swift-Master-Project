name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Run Native Swift Analyzer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🚀 Запускаємо твій власний Swift-інструмент..."
          swift run --package-path ./tool-repo/Analyzer Analyzer ${{ github.workspace }}/TestFile.swift --api-key $GROQ_API_KEY --output ${{ github.workspace }}/report.json

      - name: 4. Post AI Comment with Auto-Fix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('report.json')) {
              console.log('❌ report.json не знайдено!');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
            if (!report.aiReview) {
              console.log('⚠️ ШІ не повернув поле aiReview');
              return;
            }
            
            // Назва файлу береться з твого JSON
            const filePath = report.analyzedFile || 'TestFile.swift';
            const summaryBody = `## 🤖 Swift Hybrid AI Review\n\n**Висновок:** ${report.aiReview.summary}`;
            
            if (context.eventName !== 'pull_request') {
              console.log('ℹ️ Ручний запуск. Звіт:\n', summaryBody);
              return;
            }
            
            // Формуємо масив коментарів з прив'язкою до рядків коду
            let reviewComments = [];
            if (report.aiReview.suggestions && report.aiReview.suggestions.length > 0) {
              report.aiReview.suggestions.forEach(s => {
                // Використовуємо синтаксис ```suggestion для створення кнопки авто-фіксу
                reviewComments.push({
                  path: filePath,
                  line: s.line,
                  body: `**[${s.issue_type}]**\n${s.explanation}\n\n\`\`\`suggestion\n${s.fixed_code}\n\`\`\``
                });
              });
            }
            
            try {
              if (reviewComments.length > 0) {
                // Створюємо справжнє Pull Request Review
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: summaryBody,
                  event: 'COMMENT',
                  comments: reviewComments
                });
                console.log('✅ Inline-коментарі з кнопками успішно додано!');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summaryBody + '\n\n✅ Код виглядає чудово, критичних зауважень немає!'
                });
              }
            } catch (error) {
              console.error('⚠️ Рядки не відповідають diff у цьому PR. Переходимо на стандартний коментар...', error);
              
              // Fallback: виводимо текстом, якщо GitHub не дав створити inline-коментар
              let fallbackBody = summaryBody + '\n\n### 🛠 Запропоновані виправлення:\n';
              report.aiReview.suggestions.forEach(s => {
                fallbackBody += `- **Рядок ${s.line}** (${s.issue_type}): ${s.explanation}\n`;
                fallbackBody += `\n\`\`\`swift\n// Виправлений код:\n${s.fixed_code}\n\`\`\`\n\n`;
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fallbackBody
              });
            }
