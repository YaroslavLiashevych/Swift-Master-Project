name: Native Swift AI Review

on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:

jobs:
  agent-review:
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Target Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Checkout Analyzer Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo

      - name: 3. Get Changed Swift Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.swift'

      - name: 4. Run Analyzer for each file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🚀 Починаємо аналіз..."
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$FILES" ]; then exit 0; fi
          
          for file in $FILES; do
            echo "🔍 Файл: $file"
            # Перетворюємо шлях TestCases/File.swift -> report_TestCases_File.swift.json
            report_name="report_$(echo "$file" | sed 's/\//_/g').json"
            
            swift run --package-path ./tool-repo/Analyzer Analyzer "$file" --api-key $GROQ_API_KEY --output "$report_name"
            
            echo "⏳ Пауза 45с (Rate Limit Groq)..."
            sleep 45
          done

      - name: 5. Post AI Comments with Auto-Fix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // 1. Отримуємо дані про PR та SHA коміту
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number
            });
            const commit_id = pullRequest.head.sha;

            // Отримуємо список змінених файлів
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number
            });
            const prPaths = prFiles.map(f => f.filename);

            // 2. Видалення старих коментарів бота
            const { data: comments_list } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const oldBotComments = comments_list.filter(c => c.user.login === 'github-actions[bot]' && c.body.includes('## 🤖 Swift Hybrid AI Review'));
            for (const c of oldBotComments) {
              await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id });
            }

            const reportFiles = fs.readdirSync('.').filter(f => f.startsWith('report_') && f.endsWith('.json'));
            let summaryText = '## 🤖 Swift Hybrid AI Review\n\n';
            let allSuggestions = [];

            for (const file of reportFiles) {
              console.log(`📦 Читання звіту: ${file}`);
              const raw = fs.readFileSync(file, 'utf8');
              
              const match = raw.match(/\{[\s\S]*\}/);
              if (!match) continue;
              
              let report;
              try {
                report = JSON.parse(match[0]);
              } catch (e) {
                console.error(`❌ Помилка JSON у ${file}: ${e.message}`);
                continue;
              }

              // Визначаємо структуру (підтримка обох форматів)
              const suggestions = report.suggestions || (report.aiReview && report.aiReview.suggestions) || [];
              const summary = report.summary || (report.aiReview && report.aiReview.summary) || 'Аналіз завершено';

              // 📍 ТОЧНИЙ МАПІНГ ШЛЯХУ
              // Шукаємо файл у PR, назва якого при перетворенні / в _ дасть ім'я звіту
              const realPath = prPaths.find(p => {
                const expectedName = `report_${p.replace(/\//g, '_')}.json`;
                return expectedName === file;
              }) || file.replace(/^report_/, '').replace(/\.json$/, '').replace(/_/g, '/');

              console.log(`📍 Знайдено шлях: ${realPath} (${suggestions.length} зауважень)`);

              summaryText += `### 📄 \`${realPath}\`\n${summary}\n\n`;

              if (Array.isArray(suggestions)) {
                suggestions.forEach(s => {
                  allSuggestions.push({
                    path: realPath,
                    line: parseInt(s.line),
                    side: 'RIGHT',
                    body: `**[${s.issue_type}]**\n${s.explanation}\n\n\`\`\`suggestion\n${s.fixed_code}\n\`\`\``
                  });
                });
              }
            }

            // 3. Публікація Review
            if (allSuggestions.length > 0) {
              console.log(`🚀 Надсилаємо рев'ю з ${allSuggestions.length} зауваженнями...`);
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: commit_id,
                  event: 'COMMENT',
                  comments: allSuggestions
                });
                summaryText += `\n**Всього знайдено зауважень: ${allSuggestions.length}**`;
              } catch (e) {
                console.error(`❌ Помилка GitHub API: ${e.message}`);
                summaryText += `\n⚠️ Не вдалося додати зауваження в код (можливо, невірні номери рядків у відповіді ШІ).`;
              }
            } else {
              summaryText += "✅ Критичних зауважень не виявлено.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: summaryText
            });
