name: Conductor AI Agent Review
on:
  pull_request:
    paths:
      - '**.swift'
  workflow_dispatch:
jobs:
  agent-review:
    runs-on: macos-14 # M1 ранери найстабільніші
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 1. Checkout Project
        uses: actions/checkout@v4
      - name: 2. Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: YaroslavLiashevych/SwiftHybridAnalyzer
          path: tool-repo
      - name: 3. Install and Run AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $HOME/.conductor/bin
          echo "📥 Завантаження Conductor напряму з GitHub..."
          # Завантажуємо бінарник для Apple Silicon (arm64)
          curl -L https://github.com/conductor-build/cli/releases/latest/download/conductor-macos-arm64 -o $HOME/.conductor/bin/conductor
          chmod +x $HOME/.conductor/bin/conductor
          
          echo "🚀 Запуск AI Агента..."
          $HOME/.conductor/bin/conductor run "Проаналізуй TestFile.swift через ./tool-repo/conductor.yaml. На основі результатів у report.json напиши детальний коментар у PR. Обов'язково вкажи блоки коду з fixed_code для виправлення помилок." \
          --tool ./tool-repo/conductor.yaml \
          --env file_path=TestFile.swift \
          --env api_key=$GROQ_API_KEY
